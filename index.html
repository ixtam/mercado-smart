<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Mercado Miwmiwmiw :3</title>
    <!-- SortableJS para Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <!-- Canvas Confetti para celebración -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            /* Tema Claro (Por defecto) */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #4CAF50;
            --primary-light: #e8f5e9;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-radius: 16px;
            --shadow: 0 4px 15px rgba(0,0,0,0.05);
            --drag-bg: #f8fcf9;
            --modal-bg: rgba(255, 255, 255, 0.95);
        }

        [data-theme="dark"] {
            /* Tema Oscuro */
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary: #66bb6a;
            --primary-light: #253326;
            --text-main: #f0f0f0;
            --text-muted: #a0a0a0;
            --shadow: 0 4px 15px rgba(0,0,0,0.3);
            --drag-bg: #2a2a2a;
            --modal-bg: rgba(30, 30, 30, 0.95);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        header {
            background-color: var(--card-bg);
            padding: 20px;
            border-bottom-left-radius: var(--border-radius);
            border-bottom-right-radius: var(--border-radius);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 10;
            transition: background-color 0.3s;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 20px;
            margin-bottom: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-icon:active { transform: scale(0.9); }
        
        .btn-share {
            background-color: #25D366;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
        }
        
        .btn-settings {
            background-color: var(--text-muted);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="password"] {
            flex: 1;
            padding: 12px 15px;
            background-color: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--text-muted);
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s, background-color 0.3s;
        }

        input[type="text"]:focus, input[type="password"]:focus { border-color: var(--primary); }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.95); }
        .btn-mic { background-color: #3498db; }
        .btn-mic.recording {
            background-color: #e74c3c;
            animation: pulse 1.5s infinite;
        }

        .ai-suggestions {
            background-color: var(--primary-light);
            padding: 12px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 60px;
            transition: background-color 0.3s;
        }

        .ai-header {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .ai-loading {
            font-size: 12px;
            color: var(--primary);
            animation: blink 1s infinite alternate;
            display: none;
        }

        .chips-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 5px;
            scrollbar-width: none;
        }
        .chips-container::-webkit-scrollbar { display: none; }

        .chip {
            background-color: var(--card-bg);
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            white-space: nowrap;
            cursor: pointer;
            border: 1px solid var(--primary);
            transition: all 0.2s;
        }
        .chip:active {
            background-color: var(--primary);
            color: white;
        }

        .content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .category-group { margin-bottom: 25px; }
        .category-title {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
        }

        .sortable-list {
            min-height: 20px;
            border-radius: 12px;
            transition: background-color 0.3s;
        }

        .item {
            background-color: var(--card-bg);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: opacity 0.3s, transform 0.2s, background-color 0.3s;
        }

        .sortable-ghost {
            opacity: 0.4;
            background-color: var(--drag-bg);
            border: 2px dashed var(--primary);
        }

        .drag-handle {
            color: var(--text-muted);
            font-size: 20px;
            padding-right: 12px;
            cursor: grab;
            display: flex;
            align-items: center;
            touch-action: none;
        }
        .drag-handle:active { cursor: grabbing; }

        .item.completed { opacity: 0.5; }
        
        .item-content {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .checkbox {
            width: 24px;
            height: 24px;
            border: 2px solid var(--primary);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .item.completed .checkbox { background-color: var(--primary); }
        .item.completed .checkbox::after {
            content: "✓";
            color: white;
            font-weight: bold;
        }

        .item-text {
            font-size: 16px;
            transition: all 0.3s;
        }
        .item.completed .item-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-size: 18px;
            padding: 8px;
            cursor: pointer;
            border-radius: 8px;
        }

        .fab-clear {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 50px;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            cursor: pointer;
            display: none; /* Se muestra por JS */
            align-items: center;
            gap: 8px;
            z-index: 100;
            transition: transform 0.2s;
        }
        .fab-clear:active { transform: scale(0.95); }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center; justify-content: center;
            z-index: 1000;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(3px);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content {
            background: var(--modal-bg);
            padding: 25px; 
            border-radius: 20px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px); 
            transition: transform 0.3s ease;
            color: var(--text-main);
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        
        .modal-title { font-size: 20px; font-weight: 600; margin-bottom: 20px; color: var(--primary);}
        
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Toggle Switch para Modo Oscuro */
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px;
            left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(22px); }

        .modal-button {
            width: 100%; margin-top: 15px; padding: 12px 20px;
            background-color: var(--primary); color: white;
            border: none; border-radius: 12px; cursor: pointer; font-size: 16px; font-weight: bold;
        }
        .modal-button.secondary {
            background-color: transparent; color: var(--text-muted); border: 1px solid var(--text-muted); margin-top: 10px;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }
        @keyframes blink { from { opacity: 0.4; } to { opacity: 1; } }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="header-top">
            <h1>🛒 Mi Mercado Miwmiwmiw :3</h1>
            <div class="header-actions">
                <button class="btn-icon btn-settings" onclick="openSettings()" title="Ajustes">⚙️</button>
                <button class="btn-icon btn-share" onclick="shareToWhatsApp()" title="Exportar a WhatsApp">
                    <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                </button>
            </div>
        </div>
        <div class="input-group">
            <button class="btn btn-mic" id="btn-mic">🎤</button>
            <input type="text" id="item-input" placeholder="Ej. Tomate, Leche, Jabón..." autocomplete="off">
            <button class="btn" id="btn-add">➕</button>
        </div>
        
        <div class="ai-suggestions" id="ai-section">
            <div class="ai-header">
                <span>✨ Sugerencias Inteligentes:</span>
                <span class="ai-loading" id="ai-loading">Pensando...</span>
            </div>
            <div class="chips-container" id="chips-container"></div>
        </div>
    </header>

    <div class="content" id="list-container">
        <!-- Listas renderizadas dinámicamente -->
    </div>
    
    <!-- Botón Flotante para borrar completados -->
    <button class="fab-clear" id="btn-clear-completed" onclick="clearCompleted()">
        🧹 Borrar Comprados
    </button>
</div>

<!-- Modal de Alerta Estándar -->
<div class="modal-overlay" id="custom-alert">
    <div class="modal-content" style="text-align: center;">
        <p id="alert-message" style="margin-bottom: 20px; font-size: 16px; line-height: 1.5;"></p>
        <button class="modal-button" onclick="closeAlert()">Aceptar</button>
    </div>
</div>

<!-- Modal de Ajustes -->
<div class="modal-overlay" id="settings-modal">
    <div class="modal-content">
        <div class="modal-title">⚙️ Ajustes</div>
        
        <div class="setting-row">
            <span>Modo Oscuro</span>
            <label class="switch">
                <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode()">
                <span class="slider"></span>
            </label>
        </div>
        
        <div style="margin-bottom: 15px;">
            <span style="display: block; margin-bottom: 8px; font-size: 14px;">Clave API de Gemini (Para IA Real):</span>
            <input type="password" id="api-key-input" placeholder="Pega tu API Key de Google aquí" style="width: 100%; margin-bottom: 5px;">
            <small style="color: var(--text-muted); font-size: 11px;">Si lo dejas vacío, usará el modo inteligente básico.</small>
        </div>

        <button class="modal-button" onclick="saveSettings()">Guardar Ajustes</button>
        <button class="modal-button secondary" onclick="closeSettings()">Cancelar</button>
    </div>
</div>

<script>
    // Utilidades de interfaz
    function showAlert(message) {
        document.getElementById('alert-message').innerHTML = message;
        document.getElementById('custom-alert').classList.add('active');
    }
    function closeAlert() { document.getElementById('custom-alert').classList.remove('active'); }

    // Preferencias y Estado
    let items = JSON.parse(localStorage.getItem('mercado_items')) || [];
    let savedApiKey = localStorage.getItem('mercado_api_key') || '';
    let isDarkMode = localStorage.getItem('mercado_dark_mode') === 'true';
    let sortableInstances = [];

    // Aplicar Modo Oscuro al inicio
    if (isDarkMode) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.getElementById('dark-mode-toggle').checked = true;
    }
    
    document.getElementById('api-key-input').value = savedApiKey;

    function openSettings() { document.getElementById('settings-modal').classList.add('active'); }
    function closeSettings() { document.getElementById('settings-modal').classList.remove('active'); }

    function toggleDarkMode() {
        isDarkMode = document.getElementById('dark-mode-toggle').checked;
        if (isDarkMode) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.removeAttribute('data-theme');
        }
        localStorage.setItem('mercado_dark_mode', isDarkMode);
    }

    function saveSettings() {
        savedApiKey = document.getElementById('api-key-input').value.trim();
        localStorage.setItem('mercado_api_key', savedApiKey);
        closeSettings();
        triggerAIUpdate(); // Actualizar sugerencias si se puso una nueva llave
    }

    const categoryMap = {
        '🍎 Frutas y Verduras': ['tomate', 'cebolla', 'papa', 'zanahoria', 'limón', 'manzana', 'platano', 'lechuga', 'ajo', 'fruta', 'verdura', 'aguacate', 'brocoli', 'fresa', 'cilantro'],
        '🥩 Carnes y Proteínas': ['carne', 'pollo', 'pescado', 'cerdo', 'hamburguesa', 'salchicha', 'atún', 'salmón', 'pavo', 'chorizo', 'tocino'],
        '🥛 Lácteos y Huevos': ['leche', 'queso', 'huevo', 'huevos', 'yogurt', 'mantequilla', 'nata', 'crema'],
        '🍞 Despensa': ['arroz', 'fideo', 'pasta', 'azúcar', 'sal', 'aceite', 'pan', 'harina', 'cereal', 'galletas', 'café', 'te', 'lentejas', 'frijoles', 'mayonesa', 'ketchup', 'salsa'],
        '🧼 Limpieza y Hogar': ['jabón', 'detergente', 'papel', 'lavavajillas', 'shampoo', 'esponja', 'basura', 'limpiador', 'cloro', 'suavizante', 'escoba', 'pasta dental'],
        '🥤 Bebidas': ['agua', 'jugo', 'refresco', 'cerveza', 'vino', 'soda', 'licor', 'coca'],
        '🍬 Snacks y Dulces': ['chocolate', 'papas fritas', 'dulces', 'helado', 'mani', 'chicle'],
        '📦 Otros': []
    };
    
    const masterCategories = Object.keys(categoryMap);

    const localSuggestionsDB = [
        { trigger: ['pasta', 'fideo', 'espagueti', 'macarrones'], suggest: ['Salsa de tomate', 'Queso parmesano', 'Carne molida', 'Albahaca', 'Orégano'] },
        { trigger: ['carne', 'res', 'bife'], suggest: ['Papas', 'Cebolla', 'Tomate', 'Carbón', 'Sal gruesa', 'Chorizo'] },
        { trigger: ['pollo', 'pechuga'], suggest: ['Limón', 'Ajo', 'Arroz', 'Zanahoria', 'Mayonesa', 'Papas'] },
        { trigger: ['cerdo', 'chorizo'], suggest: ['Salsa BBQ', 'Limón', 'Tortillas', 'Aguacate', 'Cebolla'] },
        { trigger: ['leche'], suggest: ['Cereal', 'Café', 'Galletas', 'Avena', 'Cacao', 'Pan'] },
        { trigger: ['detergente', 'ropa'], suggest: ['Suavizante', 'Jabón en barra', 'Cloro', 'Ganchos', 'Pinzas'] },
        { trigger: ['pan', 'sandwich', 'jamón'], suggest: ['Jamón', 'Queso', 'Mayonesa', 'Mantequilla', 'Lechuga', 'Tomate'] },
        { trigger: ['arroz'], suggest: ['Lentejas', 'Aceite', 'Ajo', 'Cebolla', 'Huevo', 'Atún'] },
        { trigger: ['perro', 'gato', 'mascota'], suggest: ['Croquetas', 'Sobres húmedos', 'Arena', 'Premios', 'Shampoo mascota'] },
        { trigger: ['lechuga', 'ensalada'], suggest: ['Tomate', 'Pepino', 'Aceite de oliva', 'Limón', 'Zanahoria', 'Aguacate'] },
        { trigger: ['harina', 'pastel'], suggest: ['Huevos', 'Azúcar', 'Mantequilla', 'Levadura', 'Leche', 'Vainilla'] },
        { trigger: ['limpiar', 'baño', 'piso'], suggest: ['Cloro', 'Desinfectante', 'Esponja', 'Bolsas de basura', 'Guantes'] },
        { trigger: ['pescado', 'atún', 'salmón'], suggest: ['Limón', 'Galletas saladas', 'Mayonesa', 'Cebolla', 'Cilantro'] },
        { trigger: 'default', suggest: ['Huevos', 'Papel Higiénico', 'Aceite', 'Agua', 'Jabón de tocador', 'Leche', 'Tomate', 'Cebolla', 'Plátano', 'Manzana', 'Ajo', 'Limón', 'Frijoles', 'Azúcar'] }
    ];

    const input = document.getElementById('item-input');
    const btnAdd = document.getElementById('btn-add');
    const btnMic = document.getElementById('btn-mic');
    const listContainer = document.getElementById('list-container');
    const chipsContainer = document.getElementById('chips-container');
    const aiLoading = document.getElementById('ai-loading');
    const btnClearCompleted = document.getElementById('btn-clear-completed');

    function saveAndRender(skipSuggestionUpdate = false) {
        localStorage.setItem('mercado_items', JSON.stringify(items));
        renderList();
        checkCompletionCelebration();
        if (!skipSuggestionUpdate) triggerAIUpdate();
    }

    function determineCategory(itemName) {
        const lowerName = itemName.toLowerCase();
        for (const [category, keywords] of Object.entries(categoryMap)) {
            if (keywords.some(kw => lowerName.includes(kw))) return category;
        }
        return '📦 Otros';
    }

    function addItem(name) {
        if (!name.trim()) return;
        const newItem = {
            id: Date.now(),
            text: name.trim(),
            category: determineCategory(name),
            completed: false
        };
        items.push(newItem);
        input.value = '';
        saveAndRender();
    }

    function toggleItem(id) {
        const item = items.find(i => i.id === id);
        if (item) {
            item.completed = !item.completed;
            saveAndRender(true); 
        }
    }

    function deleteItem(id) {
        items = items.filter(i => i.id !== id);
        saveAndRender();
    }

    // NUEVA FUNCIÓN: Limpiar completados
    function clearCompleted() {
        const confirmDelete = confirm("¿Seguro que deseas borrar todos los productos tachados?");
        if(confirmDelete) {
            items = items.filter(i => !i.completed);
            saveAndRender();
        }
    }

    // NUEVA FUNCIÓN: Celebración con Confeti
    function checkCompletionCelebration() {
        const hasItems = items.length > 0;
        const allCompleted = hasItems && items.every(i => i.completed);
        const hasCompletedItems = items.some(i => i.completed);

        // Mostrar u ocultar botón de limpieza
        btnClearCompleted.style.display = hasCompletedItems ? 'flex' : 'none';

        if (allCompleted) {
            // ¡Lanzar confeti!
            confetti({
                particleCount: 100,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#4CAF50', '#25D366', '#ffffff']
            });
            setTimeout(() => showAlert("¡Felicidades! 🎉 Has terminado todas tus compras."), 500);
        }
    }

    let aiTimeout = null;
    function triggerAIUpdate() {
        clearTimeout(aiTimeout);
        // Reducimos el tiempo a 800ms para que reaccione rápido mientras escribes
        aiTimeout = setTimeout(updateAISuggestions, 800); 
    }

    async function updateAISuggestions() {
        chipsContainer.innerHTML = '';
        
        // 1. Obtener contexto en vivo (Lo que ya está en la lista + lo que se está escribiendo AHORA)
        const currentInputText = input.value.trim().toLowerCase();
        const activeItemsTexts = items.filter(i => !i.completed).map(i => i.text.toLowerCase());
        
        const contextWords = [...activeItemsTexts];
        if (currentInputText) {
            contextWords.push(currentInputText);
        }

        const allCurrentItemNames = items.map(i => i.text.toLowerCase());
        
        // Si no hay nada escrito ni en la lista, dar sugerencias frescas
        if (contextWords.length === 0) {
            const initialSuggestions = ["Manzana", "Tomate", "Carne de Res", "Huevos", "Leche", "Zanahoria", "Plátano", "Cebolla", "Pollo", "Aguacate", "Pan"]
                .sort(() => 0.5 - Math.random())
                .slice(0, 4);
            renderChips(initialSuggestions);
            return;
        }

        aiLoading.style.display = 'block';

        // Intento con IA Real si hay clave API
        if (savedApiKey) {
            try {
                const prompt = `Analiza este contexto de lista de compras: ${contextWords.join(', ')}. Eres un Chef/Administrador de Hogar. Deduce qué receta o tarea preparan en base a esos artículos. Sugiere EXACTAMENTE 4 ingredientes o artículos complementarios que falten y tengan mucha relación. REGLA CRÍTICA: Sugiere productos ESPECÍFICOS exactos (ej. "Manzana", "Tomate"), NUNCA categorías generales. Responde SOLO con los 4 nombres específicos separados por comas, sin puntos.`;
                const payload = { contents: [{ parts: [{ text: prompt }] }] };
                const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${savedApiKey}`;

                const response = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (response.ok) {
                    const result = await response.json();
                    const text = result.candidates[0].content.parts[0].text;
                    let aiSuggestions = text.split(',')
                        .map(s => s.trim().replace(/['"]/g, '').replace(/^\w/, c => c.toUpperCase()))
                        .filter(s => s.length > 0 && !allCurrentItemNames.includes(s.toLowerCase())); // Filtra los que ya usaste
                    
                    if (aiSuggestions.length > 0) {
                        renderChips(aiSuggestions.slice(0, 4));
                        aiLoading.style.display = 'none';
                        return; 
                    }
                }
            } catch (error) {
                console.log("Error API IA, usando fallback.", error);
            }
        }

        // Fallback Inteligente Local
        let suggestionsToDisplay = new Set();
        contextWords.forEach(itemText => {
            localSuggestionsDB.forEach(rule => {
                if (rule.trigger !== 'default' && rule.trigger.some(t => itemText.includes(t))) {
                    rule.suggest.forEach(s => suggestionsToDisplay.add(s));
                }
            });
        });

        if (suggestionsToDisplay.size === 0) {
            localSuggestionsDB.find(r => r.trigger === 'default').suggest.forEach(s => suggestionsToDisplay.add(s));
        }

        // Convertir a array, filtrar los repetidos/ya en lista, mezclar aleatoriamente y tomar los primeros 4
        let finalSuggestions = Array.from(suggestionsToDisplay)
            .filter(s => !allCurrentItemNames.includes(s.toLowerCase())) // Ya no sugiere los que usaste
            .sort(() => 0.5 - Math.random()) // Mezcla para que salgan diferentes
            .slice(0, 4);
            
        // Fallback final
        const fallbackSpecifics = ["Plátano", "Zanahoria", "Pan", "Aguacate", "Queso", "Limón"]
            .filter(s => !allCurrentItemNames.includes(s.toLowerCase()))
            .sort(() => 0.5 - Math.random());
            
        renderChips(finalSuggestions.length > 0 ? finalSuggestions : fallbackSpecifics.slice(0,4));
        aiLoading.style.display = 'none';
    }

    function renderChips(arr) {
        chipsContainer.innerHTML = '';
        arr.forEach(sugg => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.innerText = '+ ' + sugg;
            chip.onclick = () => addItem(sugg);
            chipsContainer.appendChild(chip);
        });
    }

    function shareToWhatsApp() {
        if (items.length === 0) {
            showAlert("La lista está vacía.");
            return;
        }
        let text = "🛒 *Mi Mercado Miwmiwmiw :3*\n\n";
        const grouped = items.reduce((acc, item) => {
            if (!acc[item.category]) acc[item.category] = [];
            acc[item.category].push(item); return acc;
        }, {});

        Object.keys(grouped).sort().forEach(category => {
            text += `*${category}*\n`;
            grouped[category].sort((a, b) => a.completed - b.completed).forEach(item => {
                text += item.completed ? `~- ${item.text}~\n` : `- ${item.text}\n`;
            });
            text += "\n";
        });
        window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }

    function renderList() {
        sortableInstances.forEach(inst => inst.destroy());
        sortableInstances = [];
        listContainer.innerHTML = '';
        
        if (items.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:40px;">Lista vacía.<br>¡Añade productos para empezar! 🛒</div>';
            return;
        }

        masterCategories.forEach(category => {
            const categoryItems = items.filter(i => i.category === category);
            const groupDiv = document.createElement('div');
            groupDiv.className = 'category-group';
            
            groupDiv.innerHTML = `<div class="category-title"><span>${category}</span> <span style="font-size:11px; opacity:0.5">${categoryItems.length}</span></div>`;

            const itemListContainer = document.createElement('div');
            itemListContainer.className = 'sortable-list';
            itemListContainer.dataset.category = category; 
            
            categoryItems.sort((a, b) => a.completed - b.completed).forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = `item ${item.completed ? 'completed' : ''}`;
                itemDiv.dataset.id = item.id;
                
                itemDiv.innerHTML = `
                    <div class="drag-handle">≡</div>
                    <div class="item-content" onclick="toggleItem(${item.id})">
                        <div class="checkbox"></div>
                        <div class="item-text">${item.text}</div>
                    </div>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteItem(${item.id})">🗑️</button>
                `;
                itemListContainer.appendChild(itemDiv);
            });

            groupDiv.appendChild(itemListContainer);
            if(categoryItems.length > 0 || items.length > 0) listContainer.appendChild(groupDiv);

            const sortable = Sortable.create(itemListContainer, {
                group: 'mercado-shared',
                animation: 150,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                onEnd: function (evt) {
                    const itemId = parseInt(evt.item.dataset.id);
                    const newCategory = evt.to.dataset.category;
                    const itemIndex = items.findIndex(i => i.id === itemId);
                    if (itemIndex > -1 && items[itemIndex].category !== newCategory) {
                        items[itemIndex].category = newCategory;
                        saveAndRender(true);
                    }
                }
            });
            sortableInstances.push(sortable);
        });
    }

    btnAdd.addEventListener('click', () => addItem(input.value));
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') addItem(input.value); });
    
    // NUEVO: Reaccionar en tiempo real mientras el usuario escribe
    input.addEventListener('input', () => triggerAIUpdate());

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
        const recognition = new SpeechRecognition();
        recognition.lang = 'es-ES';
        recognition.interimResults = false;
        let isRecording = false;

        recognition.onstart = function() {
            isRecording = true;
            btnMic.classList.add('recording');
            input.placeholder = "Escuchando...";
        };

        recognition.onspeechend = function() {
            isRecording = false;
            recognition.stop();
            btnMic.classList.remove('recording');
            input.placeholder = "Ej. Tomate, Leche...";
        };

        recognition.onresult = function(event) {
            const cleanText = event.results[0][0].transcript.replace(/\.$/, "");
            input.value = cleanText;
            addItem(cleanText);
        };

        recognition.onerror = function(event) {
            isRecording = false;
            btnMic.classList.remove('recording');
            input.placeholder = "Ej. Tomate, Leche...";
            
            let errMsg = "Error con el micrófono.";
            if (event.error === 'not-allowed') errMsg = "Permiso de micrófono denegado.";
            else if (event.error === 'network') errMsg = "Error de red: El navegador bloqueó la conexión de voz.";
            showAlert(errMsg);
        };

        btnMic.addEventListener('click', () => {
            if (isRecording) { recognition.stop(); return; }
            try { recognition.start(); } catch (e) { console.log(e); }
        });
    } else {
        btnMic.style.display = 'none';
    }

    saveAndRender(false);
</script>
